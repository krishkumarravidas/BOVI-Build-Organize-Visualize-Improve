name: Website

# Publishes site/ (plus the screenshots and icon) to the gh-pages branch.
# One-time: Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / (root).
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'assets/icon.png', 'app.json', 'src/lib/attendanceFormat.ts', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node scripts/build-site.mjs out
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true

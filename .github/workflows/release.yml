name: Build Android APK

# Release a version either way:
#  - push a tag like v1.0.1, or
#  - Actions → "Build Android APK" → Run workflow, enter the version (creates the tag + release).
#    Untick "release" to only build the APK as a downloadable artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release, e.g. v1.0.1'
        required: true
        default: 'v1.1.0'
      release:
        description: 'Publish a GitHub release (otherwise only build the APK artifact)'
        type: boolean
        default: true

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          NAME="BOVI-${VERSION//\//-}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          cp "$NAME" BOVI.apk
          echo "APK=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME" BOVI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: BOVI ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          # BOVI.apk keeps a stable name so releases/latest/download/BOVI.apk always works (used by the website).
          files: |
            ${{ env.APK }}
            BOVI.apk
          make_latest: true
